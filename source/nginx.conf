map "$status:$uri" $group3_cache_control {
  default "no-store";
  "~^(200|206|304):/(group3/)?assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" "public, max-age=31536000, immutable";
  "~^(200|206|304):.*\.(avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|eot|mp3|m4a|ogg|wav|mp4|webm)$" "public, max-age=2592000, stale-while-revalidate=86400";
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  etag on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  add_header Cache-Control $group3_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  location = / {
    return 302 /home/;
  }

  location = /group3 {
    return 302 /group3/;
  }

  location ^~ /group3/ {
    try_files $uri $uri/ /group3/index.html;
  }

  location ^~ /assets/ {
    alias /usr/share/nginx/html/group3/assets/;
  }

  location = /favicon.png {
    alias /usr/share/nginx/html/group3/favicon.png;
  }

  location = /favicon.svg {
    alias /usr/share/nginx/html/group3/favicon.svg;
  }

  location = /icons.svg {
    alias /usr/share/nginx/html/group3/icons.svg;
  }

  location = /theme-init.js {
    alias /usr/share/nginx/html/group3/theme-init.js;
  }

  location /home {
    try_files $uri $uri/ /group3/index.html;
  }

  location /hsk1 {
    try_files $uri $uri/ /group3/index.html;
  }

  location /hsk2 {
    try_files $uri $uri/ /group3/index.html;
  }

  location /hsk3 {
    try_files $uri $uri/ /group3/index.html;
  }

  location ~ /\. {
    deny all;
  }

  location / {
    try_files $uri $uri/ /group3/index.html;
  }
}
